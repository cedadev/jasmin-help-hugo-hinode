title = "TEST JASMIN Help Site"
copyright = "Copyright © 2025 Science and Technology Facilities Council."
enableGitInfo = true #true #for production

# additional settings
baseURL = 'https://jasmin-help-test.jasmin.ac.uk' # temp value until we have a domain
canonifyURLs = false
enableEmoji = true
enableRobotsTXT = true
enableInlineShortcodes = true
summaryLength = 20
#Parser.wrapStandAloneImageWithinParagraph = false # see https://gethinode.com/docs/content/images-and-figures/

# prevent build failures when using Hugo's Instagram shortcode due to deprecated Instagram API.
# See https://github.com/gohugoio/hugo/issues/7228#issuecomment-714490456
ignoreErrors = ["error-remote-getjson", "warn-missing-page-argument"] # , "warn-invalid-arguments"
#ignoreLogs = ['warn-missing-page-argument']

timeout = "600s"

locale = "en-gb"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[outputFormats]
  [outputFormats.server]
    mediaType = "application/toml"
    baseName = "server"
    isPlainText = true
    notAlternative = true
    permalinkable = true
    root = true
  [outputFormats.XML]
    isPlainText = false
    mediaType = "application/xml"
    isHtml = false
    noUgly = true
    permalinkable = false
    name = "xml"
  [outputFormats.llmstxt]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true
    rel = "alternate"
    root = true
  [outputFormats.markdown]
    mediaType = "text/markdown"
    baseName = "index"
    isPlainText = true
    isHTML = false
    noUgly = false
    rel = "alternate"
  # Optional: add llmscomponents for Hinode documentation sites
  #[outputFormats.llmscomponents]
  #  mediaType = "application/json"
  #  baseName = "llms-components"
  #  isPlainText = true
  #  notAlternative = true
  #  root = true

[outputs]
  home = ["HTML", "RSS", "server"] #, "llmstxt", "markdown"]   # add "llmscomponents" for documentation sites
  #page = ["HTML", "markdown"]
  #section = ["HTML", "markdown"]

[build]
  writeStats = true

[taxonomies]
  tag = 'tags'

[pagination]
  pagerSize = 12

[privacy]
  [privacy.vimeo]
    disabled = false
    simple = true

  [privacy.instagram]
    disabled = false
    simple = true

  [privacy.youtube]
    disabled = false
    privacyEnhanced = true

[services]
  [services.instagram]
    disableInlineCSS = true
  [services.x]
    disableInlineCSS = true
  [services.googleAnalytics]
    #ID = "G-JJZZ5F2KN4"

[minify]
  [minify.tdewolff.js]
    precision = 0
    version = 2022
  [minify.tdewolff.html]
    keepWhitespace = true

[module]
  [module.hugoVersion]
    extended = true
    min = "0.158.0"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.imports]]
    path = "github.com/gethinode/mod-blocks/v2"
  [[module.imports]]
    path = "github.com/gethinode/hinode/v3"
  [[module.imports]]
    path = "github.com/gethinode/mod-llm/v2"

[segments]
  [segments.headers]
    [[segments.headers.includes]]
       kind = '{home}'
       output = '{server}'
